name: iOS Certificates (one-time setup)

# 初回だけ手動実行して、証明書/プロビジョニングプロファイルを生成し
# match リポジトリへ保存する（Mac不要。Secrets設定後に1回 Run workflow）。
on:
  workflow_dispatch:

jobs:
  certs:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      APP_IDENTIFIER: com.selllater.app
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Prepare ASC API key
        run: |
          KEYFILE="$RUNNER_TEMP/asc_api_key.p8"
          if printf '%s' "$APP_STORE_CONNECT_API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$KEYFILE"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$KEYFILE"
          fi
          echo "ASC_API_KEY_PATH=$KEYFILE" >> "$GITHUB_ENV"
          head -1 "$KEYFILE"
          if openssl pkey -in "$KEYFILE" -noout; then echo "KEY OK"; else echo "KEY INVALID"; exit 1; fi

      - name: Verify match git access
        run: |
          case "$MATCH_GIT_URL" in
            https://github.com/*.git) echo "URL format: OK (https + .git)";;
            https://github.com/*) echo "URL format: https だが .git が無い";;
            git@*) echo "URL format: SSH(git@) → HTTPSに変更が必要";;
            "") echo "URL: 空です(MATCH_GIT_URL未設定)";;
            *) echo "URL format: 想定外";;
          esac
          if printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 -d 2>/dev/null | grep -q ":"; then
            echo "BASIC_AUTH: user:token 形式にデコードOK"
          else
            echo "BASIC_AUTH: 不正(base64でない/コロン無し)"
          fi
          echo "--- GitHub API checks ---"
          CREDS=$(printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 -d)
          echo "auth user: ${CREDS%%:*}"
          echo "token /user http: $(curl -s -o /dev/null -w '%{http_code}' -u "$CREDS" https://api.github.com/user)  (200=有効/401=トークン無効)"
          REPO_PATH=$(printf '%s' "$MATCH_GIT_URL" | sed -E 's#https://github.com/##; s#\.git$##')
          echo "repo /repos http: $(curl -s -o /dev/null -w '%{http_code}' -u "$CREDS" "https://api.github.com/repos/$REPO_PATH")  (200=アクセス可/404=未存在orアクセス不可)"
          echo "--- git ls-remote ---"
          set +e
          OUT=$(git -c http.extraheader="Authorization: Basic $MATCH_GIT_BASIC_AUTHORIZATION" ls-remote "$MATCH_GIT_URL" 2>&1); CODE=$?
          echo "$OUT" | head -5
          if [ $CODE -eq 0 ]; then echo "GIT AUTH OK"; else echo "GIT AUTH FAILED (exit $CODE)"; exit 1; fi

      - name: Create & store certificates
        run: bundle exec fastlane ios certs
