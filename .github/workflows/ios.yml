name: iOS TestFlight

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_IDENTIFIER: com.selllater.app
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      # RevenueCat iOS公開SDKキー（JSバンドル時に必要）
      EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Prebuild iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Prepare ASC API key
        run: |
          KEYFILE="$RUNNER_TEMP/asc_api_key.p8"
          if printf '%s' "$APP_STORE_CONNECT_API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$KEYFILE"   # 生のPEMを貼った場合
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$KEYFILE"  # base64を貼った場合
          fi
          echo "ASC_API_KEY_PATH=$KEYFILE" >> "$GITHUB_ENV"
          head -1 "$KEYFILE"
          if openssl pkey -in "$KEYFILE" -noout; then echo "KEY OK"; else echo "KEY INVALID"; exit 1; fi

      - name: Verify match git access
        run: |
          case "$MATCH_GIT_URL" in
            https://github.com/*.git) echo "URL format: OK (https + .git)";;
            https://github.com/*) echo "URL format: https だが .git が無い";;
            git@*) echo "URL format: SSH(git@) → HTTPSに変更が必要";;
            "") echo "URL: 空です(MATCH_GIT_URL未設定)";;
            *) echo "URL format: 想定外";;
          esac
          if printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 -d 2>/dev/null | grep -q ":"; then
            echo "BASIC_AUTH: user:token 形式にデコードOK"
          else
            echo "BASIC_AUTH: 不正(base64でない/コロン無し)"
          fi
          echo "--- git ls-remote ---"
          set +e
          OUT=$(git -c http.extraheader="Authorization: Basic $MATCH_GIT_BASIC_AUTHORIZATION" ls-remote "$MATCH_GIT_URL" 2>&1); CODE=$?
          echo "$OUT" | head -5
          if [ $CODE -eq 0 ]; then echo "GIT AUTH OK"; else echo "GIT AUTH FAILED (exit $CODE)"; exit 1; fi

      - name: Build & upload to TestFlight
        run: bundle exec fastlane ios beta
